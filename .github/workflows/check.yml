name: Verificar status do SIS-UEMA

on:
  schedule:
    # A cada 5 minutos. O GitHub pode atrasar um pouco em horários de pico,
    # mas na prática funciona bem.
    - cron: "*/5 * * * *"
  workflow_dispatch: {} # permite rodar manualmente pela aba Actions

permissions:
  contents: write # necessário para o workflow commitar o histórico atualizado

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install requests

      - name: Rodar verificação
        run: python scripts/check.py

      - name: Commitar histórico atualizado
        run: |
          git config user.name "sis-uema-status-bot"
          git config user.email "actions@github.com"
          git add docs/data/history.json
          git diff --quiet --cached || git commit -m "chore: atualiza status ($(date -u +'%Y-%m-%dT%H:%M:%SZ'))"
          git push
